name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install srt (sandbox-runtime) + bubblewrap
        run: |
          npm install -g @anthropic-ai/sandbox-runtime
          sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep socat
          # ubuntu-24.04 runner restricts unprivileged userns via apparmor;
          # bwrap/apply-seccomp cannot create namespaces unless this is off
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
      - name: Verify srt sandbox works (diagnostic, warn-only)
        run: |
          echo '{"network":{"allowedDomains":[],"deniedDomains":["*"]},"filesystem":{"denyRead":[],"denyWrite":[],"allowWrite":["/tmp"]}}' > /tmp/srt-verify.json
          srt --debug --settings /tmp/srt-verify.json -c "echo srt-ok" 2>&1 | grep -v Skipping | tail -8
        continue-on-error: true
      - name: Sync deps (locked)
        run: uv sync --frozen
      - name: Unit & integration tests (no Docker)
        run: uv run pytest -q -m "not slow"

  usability:
    name: usability (server + gate smoke)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install srt (sandbox-runtime) + bubblewrap
        run: |
          npm install -g @anthropic-ai/sandbox-runtime
          sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true
      - name: Verify srt can sandbox (diagnostic)
        run: |
          echo '{"network":{"allowedDomains":[],"deniedDomains":["*"]},"filesystem":{"denyRead":[],"denyWrite":[],"allowWrite":["/tmp"]}}' > /tmp/srt-verify.json
          srt --debug --settings /tmp/srt-verify.json -c "echo srt-ok" 2>&1 | grep -v Skipping | tail -12
        continue-on-error: true
      - name: Sync deps (locked)
        run: uv sync --frozen
      - name: Smoke — server starts & gate allows/denies
        run: uv run python scripts/ci_smoke.py --no-docker

  bench:
    name: bench gate (metrics regression)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps (locked)
        run: uv sync --frozen
      - name: Bench gate — precision/recall/accuracy ≥ 0.95
        run: uv run python scripts/ci_bench_gate.py
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: /tmp/bench-report.json