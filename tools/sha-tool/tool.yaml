name: sha-tool
description: 计算输入字符串的 SHA-256（纯计算，无副作用）
base_image: attest-base:latest
build: 'true'
command: sh sha.sh
inputs:
- text
claims:
  allow:
  - exit
  - fd
  - file-read
  - fork
  - memory
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - network
  - other
  - perms
  - process
  - stderr
requires:
  env: []
  files:
  - sha.sh
  exec:
  - sha256sum
  - cut
  writable: []
