name: sha-tool
description: 计算输入字符串的 SHA-256（纯计算，无副作用）
command: sh sha.sh
inputs:
- text
claims:
  allow:
  - exit
  - fd
  - file-read
  - fork
  - memory
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - network
  - other
  - perms
  - process
  - stderr
  origin: operator-approved
  approved_at: '2026-09-03T05:50:10+00:00'
  approved_by: operator
requires:
  env: []
  files:
  - sha.sh
  exec:
  - sha256sum
  - cut
  writable: []
sandbox:
  srt_settings: srt-settings.json
