name: repo-stats
description: 仓库概览：文件数/行数/TODO 密度/测试文件/类型分布（纯文件扫描）
repository: true
command: python3 repo_stats.py
inputs:
- root
claims:
  allow:
  - exit
  - fd
  - file-read
  - memory
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - fork
  - network
  - other
  - perms
  - process
  - stderr
  origin: operator-approved
  approved_at: '2026-09-03T05:50:10+00:00'
requires:
  exec:
  - python3
sandbox:
  srt_settings: srt-settings.json
