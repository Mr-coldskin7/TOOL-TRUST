name: env-gate
description: 依赖 TOOL_TRUST_DEMO_KEY 环境变量；缺失时 gate 硬拒不运行
command: sh env.sh
inputs: []
claims:
  allow:
  - exit
  - fd
  - file-read
  - memory
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - network
  - other
  - perms
  - process
  - stderr
  origin: operator-approved
  approved_at: '2026-09-03T05:50:10+00:00'
requires:
  env:
  - TOOL_TRUST_DEMO_KEY
  exec:
  - sh
sandbox:
  srt_settings: srt-settings.json
