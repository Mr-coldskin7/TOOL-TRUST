name: us-market
description: 美股技术面快照（Yahoo OHLCV）：MA20/50/200、30/60日区间位置%、14日动能、52周位置
command: python3 market.py
inputs:
- ticker
- range
- interval
claims:
  allow:
  - exit
  - fd
  - file-read
  - memory
  - class: network
    hosts:
    - query1.finance.yahoo.com
    - query2.finance.yahoo.com
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - other
  - perms
  - process
  - stderr
  origin: operator-approved
  approved_at: '2026-09-03T05:50:11+00:00'
  approved_by: operator
requires:
  exec:
  - python3
sandbox:
  srt_settings: srt-settings.json
