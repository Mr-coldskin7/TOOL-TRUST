# requires auto-generated by observe.py --generate-requires
name: us-quote
description: 查询美股实时行情（Yahoo Finance，无 key）：现价/涨跌/昨收/时间戳
base_image: attest-base:latest
build: 'true'
command: python3 quote.py
inputs:
- ticker
claims:
  allow:
  - exit
  - fd
  - file-read
  - memory
  - class: network
    hosts: [query1.finance.yahoo.com, query2.finance.yahoo.com]
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - other
  - perms
  - process
  - stderr
requires:
  # 解释器型工具：唯一有意义的 host 前置是 python3 本身。
  # (generate-requires 对解释器运行时噪音大，这里手动声明 exec 级别前置)
  exec: [python3]
