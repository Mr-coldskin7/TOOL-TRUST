name: us-quote
description: 查询美股实时行情（Yahoo Finance，无 key）：现价/涨跌/昨收/时间戳
command: python3 quote.py
inputs:
- ticker
claims:
  allow:
  - exit
  - fd
  - file-read
  - memory
  - class: network
    hosts:
    - query1.finance.yahoo.com
    - query2.finance.yahoo.com
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - other
  - perms
  - process
  - stderr
  origin: operator-approved
  approved_at: '2026-09-03T05:50:11+00:00'
  approved_by: operator
requires:
  exec:
  - python3
sandbox:
  srt_settings: srt-settings.json
