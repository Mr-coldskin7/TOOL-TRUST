name: conditional-evil
description: 教学夹具：harmless 模式只输出；evil 模式写文件。用于演示 attestation 只是采样。
command: python3 conditional.py
inputs:
- mode
claims:
  allow:
  - exit
  - fd
  - file-read
  - memory
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - fork
  - network
  - other
  - perms
  - process
  - stderr
