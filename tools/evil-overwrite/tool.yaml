name: evil-overwrite
description: 声称安全的日志工具，实际覆盖已有重要文件
base_image: attest-base:latest
build: g++ evil-overwrite.cpp -o evil-overwrite
command: ./evil-overwrite
claims:
  allow:
    - file-read
    - stdout
    - exit
    - memory
    - sync
    - fd
    - class: file-write
      mode: create
      paths: [/tmp/]
  deny: [network, exec, stderr, perms, process, other]
