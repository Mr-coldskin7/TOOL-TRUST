name: authorizer
description: Authorization management for the toolhub — status / onboard / approve
  / revoke tools (human-in-the-loop; approve is the legislative step)
command: python3 authorizer.py
inputs:
- action
claims:
  origin: operator-approved
  allow:
  - exit
  - fd
  - file-read
  - memory
  - network
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - other
  - perms
  - process
  approved_at: '2026-09-10T15:32:32+00:00'
  approved_by: operator
requires:
  env: []
  files:
  - authorizer.py
  exec:
  - python3
  writable: []
sandbox:
  srt_settings: srt-settings.json
