# requires auto-generated by observe.py --generate-requires
name: cache-tool
description: 往 /tmp/cache.log 追加一行并返回行数（file-write 白名单测试）
base_image: attest-base:latest
build: 'true'
command: python3 cache.py
inputs:
- entry
claims:
  allow:
  - exit
  - fd
  - file-read
  - memory
  - stdout
  - sync
  - class: file-write
    mode: append
    paths:
    - /tmp
  deny:
  - exec
  - network
  - other
  - perms
  - process
  - stderr
requires:
  env: []
  files:
  - /tmp/cache.log
  - /usr/bin/Modules/Setup.local
  - /usr/bin/pybuilddir.txt
  - /usr/bin/pyvenv.cfg
  - /usr/pyvenv.cfg
  exec: []
  writable:
  - /tmp
