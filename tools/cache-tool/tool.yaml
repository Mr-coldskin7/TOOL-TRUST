name: cache-tool
description: 往 /tmp/cache.log 追加一行并返回行数（file-write 白名单测试）
command: python3 cache.py
inputs:
- entry
claims:
  allow:
  - exit
  - fd
  - file-read
  - memory
  - stdout
  - sync
  - class: file-write
    mode: append
    paths:
    - /tmp
  deny:
  - exec
  - network
  - other
  - perms
  - process
  - stderr
  origin: operator-approved
  approved_at: '2026-09-03T05:09:38+00:00'
requires:
  exec:
  - python3
  writable:
  - /tmp
sandbox:
  srt_settings: srt-settings.json
