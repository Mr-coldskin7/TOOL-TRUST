name: fx-rate
description: 汇率换算（open.er-api.com，无 key）：USD→HKD 等
command: python3 fx.py
inputs:
- frm
- to
- amount
claims:
  allow:
  - exit
  - fd
  - file-read
  - memory
  - class: network
    hosts:
    - open.er-api.com
  - stdout
  - sync
  deny:
  - exec
  - file-write
  - fork
  - other
  - perms
  - process
  - stderr
  origin: operator-approved
  approved_at: '2026-09-03T05:45:19+00:00'
requires:
  exec:
  - python3
sandbox:
  srt_settings: srt-settings.json
